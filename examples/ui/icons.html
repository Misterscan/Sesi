<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sesi icon workspace</title>
  <style>
    :root { font: 15px/1.5 system-ui, sans-serif; color: #283740; background: #eef2f4; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 16px; }
    main { max-width: 720px; margin: auto; padding: 26px; background: white; border: 1px solid #dce4e8; border-radius: 12px; }
    header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; }
    h1, p { margin: 0; }
    h1 { font-size: 29px; letter-spacing: -.04em; }
    .eyebrow { font-size: 11px; letter-spacing: .13em; color: #647b89; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid #547891; outline-offset: 3px; }
    button { background: white; border: 1px solid #cbd8df; border-radius: 7px; display: inline-flex; align-items: center; gap: 8px; }
    .create { padding: 8px 12px; }
    .search { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid #cbd8df; border-radius: 7px; }
    input { width: 100%; min-width: 0; border: 0; background: transparent; }
    ul { list-style: none; margin: 18px 0; padding: 0; }
    li { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #e0e7eb; padding: 7px 0; }
    .file { flex: 1; min-width: 0; text-align: left; border: 0; padding: 12px 9px; }
    .file span { overflow-wrap: anywhere; }
    .file[aria-pressed="true"] { background: #eaf2f6; }
    .delete { padding: 9px; }
    svg { flex-shrink: 0; display: block; }
    .selection { min-height: 24px; font-weight: 600; }
    .note, .empty { color: #647b89; font-size: 12px; margin-top: 8px; }
    @media (max-width: 420px) { main { padding: 18px; } }
